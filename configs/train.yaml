# Training configuration. Every run logs a copy of this file next to its artifacts.

seed: 42

data:
  path: data/creditcard.csv
  target: Class
  time_column: Time
  amount_column: Amount

split:
  # Time-ordered split (see docs/adr/0001-time-based-split.md)
  train_fraction: 0.6
  validation_fraction: 0.2
  # the remaining 0.2 is the held-out test set

costs:
  # Cost-based threshold selection (see docs/adr/0003-metrics-and-thresholds.md)
  # A missed fraud costs the transaction amount; every alert costs an analyst review.
  review_cost: 5.0
  min_fraud_cost: 10.0

decision:
  # Transactions scoring above the review threshold but below this precision target
  # go to manual review; above it they are blocked.
  block_precision_target: 0.90

models:
  logistic_regression:
    C: 0.1
    max_iter: 2000
  svm:
    kernel: rbf
    # RBF SVM scales quadratically, so it trains on all frauds plus a sample of legit
    # transactions; undersampling already rebalances, so no class weights (ADR 0005)
    negatives_per_positive: 100
    # C and gamma are chosen by validation PR-AUC; the test set is never used for tuning
    grid:
      C: [0.1, 1.0, 10.0]
      gamma: [scale, 0.01, 0.001]
  xgboost:
    n_estimators: 400
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
  keras_mlp:
    # Requires the optional extra: pip install -e '.[dl]' (see docs/adr/0006-keras-mlp.md)
    hidden_units: [64, 32]
    dropout: 0.3
    learning_rate: 0.001
    batch_size: 2048
    epochs: 50
    patience: 5
    positive_weight: 10.0
    holdout_fraction: 0.1

output:
  models_dir: models
  reports_dir: reports
